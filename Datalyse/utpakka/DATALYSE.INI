En tom linie stopper indlæsningen!
Bemærk, at hver linie består af: KODEORD, VALG, FORKLARING.
Hvis valget er tomt eller ulovligt ignoreres det.
Det er ligegyldigt, om du skriver små eller store bogstaver.
Datalyse leder først efter ini-filen i sit eget katalog,
så i roden på C-drevet. Man kan også indsætte er arbejdskatalog,
linien ser således ud:
STI,C:\DATALYSE\
Er et apparat ON, vises det i menuen for valg af apparat i Datalyse.
Er det OFF, vises det ikke, eksempel: 

APPARAT,64,OFF: Fluke 867B Multimeter, 25/6 1998
