<h2><font color="#0000FF">Fluorescerende sten</font></h2>
<hr>

<blockquote>
  <p class="MsoNormal"><img src="images/fluors1.jpg" v:shapes="_x0000_i1025" width="642" height="350"></p>
</blockquote>
<p>På billedet ses blandt andet rød rubin, tugtupit, fluorit, honning calcit,
sodalit og blå apatit. Andre fluorescerende sten er calcedon, vandmelons
turmalin og cobolt-calcit.</p>
<p>Stenene er belyst med ultraviolet lys fra »Black Light Blue« fra Philips
type TLD18 W.</p>
