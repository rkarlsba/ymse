<h2><font color="#0000FF">Two-way Pulley</font></h2>

<hr>

<p>Two-way Pulley kan tilsluttes LapPro og CBL 2. Et mellemkabel kan købes hos
S. Frederiksen. Bestillingsnummer: 201285 og pris ca. 150 kr.</p>

<p><font size="3">Two-way Pulley er forsynet med to fotoceller
med meget lille afstand. Derfor kan den måle retning.</font></p>
