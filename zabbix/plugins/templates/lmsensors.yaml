zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 92e2c226868147639dc11ff428f9609b
      template: LMSensors
      name: LMSensors
      groups:
        - name: Templates
      items:
        - uuid: 74dde517a2de4bb2b168291348b4fca9
          name: 'Sensors JSON'
          key: sensors
          history: '0'
          value_type: TEXT
          tags:
            - tag: Application
              value: 'Sensors Raw'
      discovery_rules:
        - uuid: 7b11738186104c5fab579069bfa70a77
          name: 'Discover Fans'
          type: DEPENDENT
          key: sensors.discovery.fan
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: a04c66a84f894cb5a7c4080de4bca288
              name: 'Fan ''{#DRIVER}'' - ''{#LABEL}'''
              type: DEPENDENT
              key: 'sensors.fan[''{#DRIVER}'', ''{#SENSOR}'']'
              history: 30d
              units: RPM
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''{#DRIVER}''][''{#SENSOR}''].input'
              master_item:
                key: sensors
              tags:
                - tag: Application
                  value: 'Sensors - Fan'
              trigger_prototypes:
                - uuid: 14bff65404db4e7ea722a124d4ec42f6
                  expression: 'last(/LMSensors/sensors.fan[''{#DRIVER}'', ''{#SENSOR}''])<{$SENSORS_FAN_LOW:"{#DRIVER}_{#SENSOR}"}'
                  name: 'Fan ''{#DRIVER}'' - ''{#LABEL}'' speed is too low ({ITEM.LASTVALUE})'
                  priority: HIGH
          master_item:
            key: sensors
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var inp = JSON.parse(value);
                  var out = [];
                  
                  Object.keys(inp).forEach(function(drv) {
                   var v = inp[drv];
                  
                   Object.keys(v).forEach(function(sens) {
                     var v2 = v[sens];
                     var label = sens;
                     if (v2.label) {
                       label = v2.label;
                     }
                     if (v2.sensor_type == "fan") {
                       out.push({
                         "{#DRIVER}": drv,
                         "{#SENSOR}": sens,
                         "{#LABEL}": label
                       })
                     }
                   })
                  })
                  
                  return JSON.stringify(out);
        - uuid: acd8137d037a4ae390660a23374a56c9
          name: 'Discover Power'
          type: DEPENDENT
          key: sensors.discovery.power
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: fbd5e4aaab9c4d85b24cbbaa6238804c
              name: 'Power ''{#DRIVER}'' - ''{#LABEL}'''
              type: DEPENDENT
              key: 'sensors.power[''{#DRIVER}'', ''{#SENSOR}'']'
              history: 30d
              value_type: FLOAT
              units: W
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''{#DRIVER}''][''{#SENSOR}''].average'
                - type: MULTIPLIER
                  parameters:
                    - '1.0E-6'
              master_item:
                key: sensors
              tags:
                - tag: Application
                  value: 'Sensors - Power'
          master_item:
            key: sensors
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var inp = JSON.parse(value);
                  var out = [];
                  
                  Object.keys(inp).forEach(function(drv) {
                   var v = inp[drv];
                  
                   Object.keys(v).forEach(function(sens) {
                     var v2 = v[sens];
                     var label = sens;
                     if (v2.label) {
                       label = v2.label;
                     }
                     if (v2.sensor_type == "power") {
                       out.push({
                         "{#DRIVER}": drv,
                         "{#SENSOR}": sens,
                         "{#LABEL}": label
                       })
                     }
                   })
                  })
                  
                  return JSON.stringify(out);
        - uuid: 393379127d0f48f4bb3763c00273ba43
          name: 'Discover Temperature'
          type: DEPENDENT
          key: sensors.discovery.temp
          filter:
            conditions:
              - macro: '{#VALUE}'
                value: '^-?\d+$'
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: b6f0377dd1a5484482811100d2d86a7c
              name: 'Temperature ''{#DRIVER}'' - ''{#LABEL}'''
              type: DEPENDENT
              key: 'sensors.temp[''{#DRIVER}'', ''{#SENSOR}'']'
              history: 30d
              value_type: FLOAT
              units: C
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''{#DRIVER}''][''{#SENSOR}''].input'
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: sensors
              tags:
                - tag: Application
                  value: 'Sensors - Temperature'
              trigger_prototypes:
                - uuid: 58d103a9f84647149bec763f1a4eebe0
                  expression: 'min(/LMSensors/sensors.temp[''{#DRIVER}'', ''{#SENSOR}''],600s)>{$SENSORS_TEMP_CRIT:"{#DRIVER}_{#SENSOR}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'min(/LMSensors/sensors.temp[''{#DRIVER}'', ''{#SENSOR}''],600s)<={$SENSORS_TEMP_CRIT:"{#DRIVER}_{#SENSOR}"}-{$SENSORS_TEMP_HYST}'
                  name: 'Temperature ''{#DRIVER}'' - ''{#LABEL}'' is critical ({ITEM.LASTVALUE})'
                  priority: HIGH
                - uuid: 8c9ae7e57a184a4daa9ec0a1cba8006b
                  expression: 'min(/LMSensors/sensors.temp[''{#DRIVER}'', ''{#SENSOR}''],600s)>{$SENSORS_TEMP_HIGH:"{#DRIVER}_{#SENSOR}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'min(/LMSensors/sensors.temp[''{#DRIVER}'', ''{#SENSOR}''],600s)<={$SENSORS_TEMP_HIGH:"{#DRIVER}_{#SENSOR}"}-{$SENSORS_TEMP_HYST}'
                  name: 'Temperature ''{#DRIVER}'' - ''{#LABEL}'' is high ({ITEM.LASTVALUE})'
                  priority: AVERAGE
          master_item:
            key: sensors
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var inp = JSON.parse(value);
                  var out = [];
                  
                  Object.keys(inp).forEach(function(drv) {
                   var v = inp[drv];
                  
                   Object.keys(v).forEach(function(sens) {
                     var v2 = v[sens];
                     var label = sens;
                     if (v2.label) {
                       label = v2.label;
                     }
                     if (v2.sensor_type == "temp") {
                       out.push({
                         "{#DRIVER}": drv,
                         "{#SENSOR}": sens,
                         "{#LABEL}": label,
                         "{#VALUE}": v2.input
                       })
                     }
                   })
                  })
                  
                  return JSON.stringify(out);
        - uuid: d19dbbd218514acc9ae77c19cb1f9c44
          name: 'Discover Voltage'
          type: DEPENDENT
          key: sensors.discovery.voltage
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 24a45e2fea8f498bb1bb9b6be11670cb
              name: 'Voltage ''{#DRIVER}'' - ''{#LABEL}'''
              type: DEPENDENT
              key: 'sensors.voltage[''{#DRIVER}'', ''{#SENSOR}'']'
              history: 30d
              value_type: FLOAT
              units: V
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''{#DRIVER}''][''{#SENSOR}''].input'
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: sensors
              tags:
                - tag: Application
                  value: 'Sensors - Voltage'
              trigger_prototypes:
                - uuid: d74a773d56f442f59efc3691c52a77dc
                  expression: 'min(/LMSensors/sensors.voltage[''{#DRIVER}'', ''{#SENSOR}''],300s)>{$SENSORS_VOLTAGE_HIGH:"{#DRIVER}_{#SENSOR}"}'
                  name: 'Voltage ''{#DRIVER}'' - ''{#LABEL}'' is too high ({ITEM.LASTVALUE})'
                  priority: AVERAGE
                - uuid: 2a6fdd9075c544f2b77b32be36bb2819
                  expression: 'max(/LMSensors/sensors.voltage[''{#DRIVER}'', ''{#SENSOR}''],300s)<{$SENSORS_VOLTAGE_LOW:"{#DRIVER}_{#SENSOR}"}'
                  name: 'Voltage ''{#DRIVER}'' - ''{#LABEL}'' is too low ({ITEM.LASTVALUE})'
                  priority: AVERAGE
          master_item:
            key: sensors
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var inp = JSON.parse(value);
                  var out = [];
                  
                  Object.keys(inp).forEach(function(drv) {
                   var v = inp[drv];
                  
                   Object.keys(v).forEach(function(sens) {
                     var v2 = v[sens];
                     var label = sens;
                     if (v2.label) {
                       label = v2.label;
                     }
                     if (v2.sensor_type == "in") {
                       out.push({
                         "{#DRIVER}": drv,
                         "{#SENSOR}": sens,
                         "{#LABEL}": label
                       })
                     }
                   })
                  })
                  
                  return JSON.stringify(out);
      macros:
        - macro: '{$SENSORS_FAN_LOW}'
          value: '0'
        - macro: '{$SENSORS_TEMP_CRIT}'
          value: '80'
        - macro: '{$SENSORS_TEMP_HIGH}'
          value: '70'
        - macro: '{$SENSORS_TEMP_HYST}'
          value: '5'
        - macro: '{$SENSORS_VOLTAGE_HIGH}'
          value: '1000'
        - macro: '{$SENSORS_VOLTAGE_LOW}'
          value: '0'
