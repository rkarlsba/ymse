zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
  templates:
    - uuid: 3324b78f737e42fb8e6e05005c581b39
      template: 'Template App FTP Service'
      name: 'Template App FTP Service'
      groups:
        - name: Templates/Modules
      items:
        - uuid: 057eaf069912400994e28af132ad5db8
          name: 'FTP service is running'
          type: SIMPLE
          key: 'net.tcp.service[ftp]'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: 'FTP service'
          triggers:
            - uuid: b299d73cebcd430c8bfc54cf9b84e853
              expression: 'max(/Template App FTP Service/net.tcp.service[ftp],#3)=0'
              name: 'FTP service is down on {HOST.NAME}'
              priority: AVERAGE
      valuemaps:
        - uuid: c363fc0046f4493eb7ba6379c41d3e58
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
