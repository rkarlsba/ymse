nftables::rules:
  'default_in-zabbix_server':
    order: '50'
    ensure: 'present'
    content: |
      tcp dport { 80 } ip saddr @om_netv4 counter accept comment "HTTP v4"
      tcp dport { 80 } ip6 saddr @om_netv6 counter accept comment "HTTP v6"
      tcp dport { 443 } ip saddr @om_netv4 counter accept comment "HTTPS v4"
      tcp dport { 443 } ip6 saddr @om_netv6 counter accept comment "HTTPS v6"
      tcp dport { 10051 } ip saddr @om_netv4 counter accept comment "Apache active agent v4"
      tcp dport { 10051 } ip6 saddr @om_netv6 counter accept comment "Apache active agent v6"

