            - type: SIMPLE_CHANGE
              parameters:
                - ''
          tags:
            - tag: Application
              value: Postfix
        - uuid: a956a25859c541cf8e383775dbb94a62
          name: 'Postfix Received'
          key: 'postfix[received]'
          delay: 3m
          history: 30d
          units: mails
          preprocessing:
            - type: SIMPLE_CHANGE
              parameters:
                - ''
          tags:
            - tag: Application
              value: Postfix
        - uuid: 6f5fd2fa88ae42a38598e23ffa82e778
          name: 'Postfix Rejected'
          key: 'postfix[rejected]'
          delay: 3m
          history: 30d
          units: mails
          preprocessing:
            - type: SIMPLE_CHANGE
              parameters:
                - ''
          tags:
            - tag: Application
              value: Postfix
        - uuid: 55da764ec6d84e74a7dd2a221f3fafbb
          name: 'Postfix Reject Warnings'
          key: 'postfix[reject_warnings]'
          delay: 3m
          history: 30d
          units: mails
          preprocessing:
            - type: SIMPLE_CHANGE
              parameters:
                - ''
          tags:
            - tag: Application
              value: Postfix
      macros:
        - macro: '{$POSTFIX_MAX_BOUNCED}'
          value: '50'
        - macro: '{$POSTFIX_MAX_DEFERRED}'
          value: '50'
        - macro: '{$POSTFIX_MAX_HELD}'
          value: '200'
        - macro: '{$POSTFIX_MAX_REJECTED}'
          value: '100'
        - macro: '{$POSTFIX_MAX_REJECT_WARNINGS}'
          value: '20000'
  triggers:
    - uuid: 6693645b846e480ea8aec7697ee8c028
      expression: 'last(/Template App Postfix/postfix[held])>{$POSTFIX_MAX_HELD} or last(/Template App Postfix/postfix.pfmailq)>{$POSTFIX_MAX_HELD}'
      name: 'Postfix: Too many held mails on {HOST.NAME}'
      priority: WARNING
    - uuid: c81176b73401484784a9905af239e9e4
      expression: 'last(/Template App Postfix/postfix[rejected])>{$POSTFIX_MAX_REJECTED} or last(/Template App Postfix/postfix[reject_warnings])>{$POSTFIX_MAX_REJECT_WARNINGS}'
      name: 'Postfix: Too many rejected mails on {HOST.NAME}'
      priority: HIGH
