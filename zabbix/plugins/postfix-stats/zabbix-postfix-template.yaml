zabbix_export:
  version: '6.0'
  date: '2025-12-10T06:51:54Z'
  groups:
    - uuid: 7df96b18c23049a09a0a9e2307226338
      name: Templates
  templates:
    - uuid: e5cc2a8a065c4272866ee0277ccc417f
      template: 'Template App Postfix'
      name: 'Template App Postfix'
      description: |
        Postfix check from https://github.com/kstka/zabbix-postfix-template, changed to avoid using sudo
        Se https://jira.oslomet.no/browse/EINFRA-4737 for mer info
      groups:
        - name: Templates
      items:
        - uuid: c39bb96edc4949ec8d4870b46fbda929
          name: 'SMTP Service'
          type: SIMPLE
          key: 'net.tcp.service[smtp]'
          history: 1w
          tags:
            - tag: Application
              value: Postfix
          triggers:
            - uuid: 3f33c174dbef4ddc824935e6b46be999
              expression: 'max(/Template App Postfix/net.tcp.service[smtp],#3)=0'
              name: 'SMTP service is down on {HOST.NAME}'
              priority: HIGH
        - uuid: b5fa080b20e2420c8dab14c671186fa6
          name: 'Postfix Mail Queue'
          key: postfix.pfmailq
          delay: 3m
          history: 30d
          units: mails
          preprocessing:
            - type: SIMPLE_CHANGE
              parameters:
                - ''
          tags:
            - tag: Application
              value: Postfix
        - uuid: 531a9ef9272d48e7b6ceca9e48feb7c3
          name: 'Postfix data update request'
          key: postfix.update_data
          history: 30d
          trends: '0'
          value_type: TEXT
          tags:
            - tag: Application
              value: Postfix
          triggers:
            - uuid: bedefc099dd84fd6bf6f11055a6a7745
              expression: 'find(/Template App Postfix/postfix.update_data,,"regexp","ERROR")=1'
              name: 'Postfix statistics could not be updated'
              priority: WARNING
        - uuid: 7cd3ee0f095745479f41a130f9f4d0fe
          name: 'Postfix Bounced'
          key: 'postfix[bounced]'
          delay: 3m
          history: 30d
          units: mails
          preprocessing:
            - type: SIMPLE_CHANGE
              parameters:
                - ''
          tags:
            - tag: Application
              value: Postfix
          triggers:
            - uuid: ab1160bd66b24df2bcde8331f7e05e2c
              expression: 'last(/Template App Postfix/postfix[bounced])>{$POSTFIX_MAX_BOUNCED}'
              name: 'Postfix: Too many bounced mails on {HOST.NAME}'
              priority: WARNING
        - uuid: 2bd4be03b4594fa1b9164c457945314c
          name: 'Postfix Bytes Delivered'
          key: 'postfix[bytes_delivered]'
          delay: 3m
          history: 30d
          units: B
          preprocessing:
            - type: SIMPLE_CHANGE
              parameters:
                - ''
          tags:
            - tag: Application
              value: Postfix
        - uuid: 58cdfb43b842476d8b2e00043055a574
          name: 'Postfix Bytes Received'
          key: 'postfix[bytes_received]'
          delay: 3m
          history: 30d
          units: B
          preprocessing:
            - type: SIMPLE_CHANGE
              parameters:
                - ''
          tags:
            - tag: Application
              value: Postfix
        - uuid: bb47ae2f75a74a3d8dc91e01a3f748b3
          name: 'Postfix Deferred'
          key: 'postfix[deferred]'
          delay: 3m
          history: 30d
          units: mails
          preprocessing:
            - type: SIMPLE_CHANGE
              parameters:
                - ''
          tags:
            - tag: Application
              value: Postfix
          triggers:
            - uuid: f6b29344b2a1463f8e1e8754dbf64fbc
              expression: 'last(/Template App Postfix/postfix[deferred])>{$POSTFIX_MAX_DEFERRED}'
              name: 'Postfix: Too many deferred mails on {HOST.NAME}'
              priority: HIGH
        - uuid: a216b3ef611143dab8b82bc16c8e30f0
          name: 'Postfix Delivered'
          key: 'postfix[delivered]'
          delay: 3m
          history: 30d
          units: mails
          preprocessing:
            - type: SIMPLE_CHANGE
              parameters:
                - ''
          tags:
            - tag: Application
              value: Postfix
        - uuid: 1d8d84e7ef164558b159efd2a88f402a
          name: 'Postfix Discarded'
          key: 'postfix[discarded]'
          delay: 3m
