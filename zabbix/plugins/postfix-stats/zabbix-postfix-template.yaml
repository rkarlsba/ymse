                - ''
          tags:
            - tag: Application
              value: Postfix
        - uuid: dc6e94bf570c4028b82fad8d23ff4a41
          name: 'Postfix Forwarded'
          key: 'postfix[forwarded]'
          delay: 3m
          history: 30d
          units: mails
          preprocessing:
